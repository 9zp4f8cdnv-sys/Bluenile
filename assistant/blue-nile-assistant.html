<style>
/* Layout: chat on the left (the agent), the shop's day on the right; stacks on phones. */
:root {
  --bg: #f5f7fa; --surface: #ffffff; --surface-2: #eef1f6; --ink: #0d0f14; --muted: #5a6475; --line: #e2e6ed;
  --navy: #0b2e6b; --gold: #ffb81c; --gold-ink: #0d0f14; --sky: #38bdf8; --me: #0b2e6b; --me-ink: #ffffff;
  --ok: #12805c; --ok-soft: #e3f5ee; --warn: #9a5b00; --warn-soft: #fff3dc; --bad: #b42318; --bad-soft: #fde8e6;
  --display: Anton, Impact, sans-serif; --body: Montserrat, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d0f14; --surface: #151a24; --surface-2: #1b2230; --ink: #f5f7fa; --muted: #9aa6b8; --line: #262f40;
  --navy: #38bdf8; --me: #1d4f9c; --me-ink: #ffffff; --ok: #4fd1a1; --ok-soft: #0f2a22; --warn: #ffc566; --warn-soft: #2d2410;
  --bad: #ff8a80; --bad-soft: #3a1714; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d0f14; --surface: #151a24; --surface-2: #1b2230; --ink: #f5f7fa; --muted: #9aa6b8; --line: #262f40;
  --navy: #38bdf8; --me: #1d4f9c; --me-ink: #ffffff; --ok: #4fd1a1; --ok-soft: #0f2a22; --warn: #ffc566; --warn-soft: #2d2410;
  --bad: #ff8a80; --bad-soft: #3a1714; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 28px; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand b { display: block; font: 26px/1 var(--display); letter-spacing: .02em; color: var(--navy); }
.brand span { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mode { margin-left: auto; display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.mode button { border: 0; background: none; border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: .88rem; color: var(--muted); }
.mode button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; min-width: 0; }
.chat { display: flex; flex-direction: column; height: min(78vh, 820px); }
.log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.msg.err { align-self: flex-start; background: var(--bad-soft); color: var(--bad); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.acts span { font-size: .75rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); white-space: nowrap; }
.thinking { color: var(--muted); font-style: italic; }
.hello h2 { font: 28px/1.05 var(--display); text-transform: uppercase; margin: 4px 0 6px; letter-spacing: .01em; }
.hello p { margin: 0 0 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: .85rem; font-weight: 600; text-align: left; }
.chip:hover { border-color: var(--navy); }
form.send { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
form.send textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface-2); min-height: 46px; max-height: 140px; }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 800; background: var(--gold); color: var(--gold-ink); }
.btn.ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 6px 10px; font-size: .8rem; border-radius: 9px; }
.btn:disabled { opacity: .5; cursor: default; }
.side { display: grid; gap: 16px; }
.side .card { padding: 16px; }
.side h3 { margin: 0 0 10px; font: 20px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.side h3 input { font: 600 .85rem var(--body); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--surface-2); }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.row:first-of-type { border-top: 0; }
.row .t { font-weight: 800; font-variant-numeric: tabular-nums; }
.row small { display: block; color: var(--muted); }
.row .r { text-align: right; }
.pill { display: inline-block; font-size: .72rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.empty { color: var(--muted); font-size: .9rem; margin: 0; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-weight: 600; margin-bottom: 14px; }
.foot { color: var(--muted); font-size: .8rem; margin-top: 14px; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .chat { height: 70vh; } .mode { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(() => {
  const D = JSON.parse(document.getElementById('shop-data').textContent);
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = c => '$' + (c / 100).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const digits = s => String(s || '').replace(/\D/g, '');
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const plate = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const SHOP = D.shop;

  // ---------- Brisbane time ----------
  const nowParts = () => {
    const f = new Intl.DateTimeFormat('en-CA', { timeZone: 'Australia/Brisbane', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    const p = Object.fromEntries(f.formatToParts(new Date()).map(x => [x.type, x.value]));
    return { date: `${p.year}-${p.month}-${p.day}`, time: `${p.hour}:${p.minute}` };
  };
  const weekday = d => new Date(d + 'T12:00:00Z').getUTCDay(); // 0 Sun
  const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const longDate = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
  const hhmm = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const fmtTime = t => { const [h, m] = t.split(':').map(Number); return `${h % 12 || 12}:${String(m).padStart(2, '0')}${h < 12 ? 'am' : 'pm'}`; };

  // ---------- price list and vehicle rules (same as the website) ----------
  const R = D.vehicle_rules;
  const ALIAS = Object.fromEntries(Object.entries(R.make_aliases || {}).map(([k, v]) => [norm(k), norm(v)]));
  const makeKey = m => ALIAS[norm(m)] || norm(m);
  function classify(make, model) {
    const mk = makeKey(make), md = norm(model);
    for (const rule of R.rules) {
      const models = {};
      for (const [k, v] of Object.entries(rule.models || {})) models[makeKey(k)] = v;
      for (const pre of models[mk] || []) if (norm(pre) === '' || md.startsWith(norm(pre))) return { tier: rule.tier, label: rule.label };
      if ((rule.makes || []).map(makeKey).includes(mk)) return { tier: rule.tier, label: rule.label };
    }
    return { tier: R.default, label: 'standard cars' };
  }
  const SERVICES = D.services;
  const byName = Object.fromEntries(SERVICES.map(s => [s.name, s]));
  const quote = s => {
    const lo = s.price_min, hi = s.price_max, u = s.unit ? ' ' + s.unit : '';
    if (lo == null && hi == null) return 'no price on the list';

  function freeTimes(date) {
    const wd = weekday(date);
    if (!OPEN_DAYS.includes((wd + 6) % 7)) return { open: false, free: [] };
    const now = nowParts(), live = Object.values(S.bookings).filter(b => b.date === date && b.status === 'booked');
    const free = [];
    for (let h = OPEN; h + LEN <= CLOSE; h++) {
      const t = `${String(h).padStart(2, '0')}:00`, s = h * 60, e = s + LEN * 60;
      if (date === now.date && s < hhmm(now.time) + 60) continue;
      const used = live.filter(b => hhmm(b.time) < e && hhmm(b.time) + LEN * 60 > s).length;
      if (used < BAYS) free.push(t);
    }
    return { open: true, free };
  }

Shop records only come from your tools: never make up customers, bookings, invoices or prices. Prices only from lookup_prices or service_price_for_car; every price includes GST. The standard service price depends on the car, so get the make and model (never ask the customer to choose a size). A price marked as not confirmed is a guide only: say so. Never guess which oil, brake pads, filters or tyres fit a car; say staff will confirm the right part and price. Search for a customer before creating one. Check availability before booking, then repeat back the day, time, car and price.`;

You are answering the phone. The customer's words are typed to you; your replies are read out to them. Be warm and brief: one or two short sentences, plain words, no lists. Get their name and number, find or create them, help with prices and bookings, read back names, numbers and times. You can't do invoices or payments on the phone. Before saying goodbye, use log_call (add a follow_up if a staff member needs to call them back).`;

<div><h1>Tax Invoice</h1><table class="meta"><tr><th>Date:</th><td>${d}</td></tr><tr><th>Invoice #:</th><td>${i.number}</td></tr></table></div></div>
<div class="band"><div><b>${esc(SHOP.name)}</b> &nbsp; <b>ABN ${esc(SHOP.abn)}</b><br>${esc(street)}<br>${esc(rest.join(',').trim())}</div>
<table><tr><th>Mobile</th><td>${esc(SHOP.phone)}</td></tr>${SHOP.email ? `<tr><th>Email</th><td>${esc(SHOP.email)}</td></tr>` : ''}${SHOP.website ? `<tr><th>Web</th><td>${esc(SHOP.website)}</td></tr>` : ''}</table></div>
<div class="box"><b>Bill to:</b> ${esc(i.name)} ${esc(i.phone)} ${esc(i.email)}${i.car ? `<br><b>Vehicle:</b> ${esc(i.car)}` : ''}</div>
<table class="l"><tr><th>Description</th><th class=n>Qty</th><th class=n>Price</th><th class=n>Total</th></tr>${rows}
<tr class=tot><td colspan=3 class=n><b>Total (incl. GST)</b></td><td class=n><b>${money(i.total_cents)}</b></td></tr>
<tr class=tot><td colspan=3 class=n>Includes GST of</td><td class=n>${money(i.gst_cents)}</td></tr>
${i.paid_cents ? `<tr class=tot><td colspan=3 class=n>Paid</td><td class=n>${money(i.paid_cents)}</td></tr><tr class=tot><td colspan=3 class=n><b>Balance due</b></td><td class=n><b>${money(i.total_cents - i.paid_cents)}</b></td></tr>` : ''}
</table><p style="color:#5b6472;margin-top:24px">Thank you for your business!</p></body></html>`;
  }
  document.addEventListener('click', async e => {
    const c = e.target.closest('[data-call]'), inv = e.target.closest('[data-inv]');
    if (c && db) { const id = c.dataset.call; await db.doc('calls/' + id).set({ ...S.calls[id], done: true }); }
    if (inv) {
      const i = S.invoices[inv.dataset.inv]; if (!i) return;
      if (!dl) { addMsg('err', "Downloads aren't available in this view."); return; }
      try { await dl.save({ filename: `Blue-Nile-invoice-${i.number}.html`, data: invoiceHtml(i) }); } catch (err) { /* viewer declined or unavailable */ }
    }
  });

  // ---------- start ----------
  $('#day').value = nowParts().date;
  $('#day').onchange = renderBookings;
  $('#m-staff').onclick = () => setMode('staff'); $('#m-caller').onclick = () => setMode('caller');
  $('#send').onsubmit = e => { e.preventDefault(); send($('#box').value); };
  $('#box').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send($('#box').value); } });
  $('#stop').onclick = () => ctl && ctl.abort();
  $('#foot').textContent = `Prices from the ${SHOP.price_list_date} price list, all including GST. Records are kept with this page and shared with everyone you give edit access to.`;
  hello(); renderBookings(); renderCalls(); renderInvoices();

  (async () => {
    if (!window.claude) { $('#banner').hidden = false; $('#banner').textContent = 'Open this page in Claude to use the assistant.'; return; }
    [sample, db, dl] = await Promise.all([claude.use('sample'), claude.use('db'), claude.use('downloads')]);
    if (sample) { try { const l = await sample.limits(); if (l.tools) toolMax = l.tools.maxCount; else sample = null; } catch (e) { /* keep defaults */ } }
    if (!sample || !db) {
      $('#banner').hidden = false;
      $('#banner').textContent = !sample ? 'The assistant needs Claude in this view. Open the page in Claude on the web or desktop while signed in.' : 'Saving is off in this view, so bookings and invoices will not be kept. Open the page in Claude while signed in.';
    }
    if (!db) return;
    const timer = setTimeout(() => { $('#banner').hidden = false; $('#banner').textContent = "Can't reach your shop records yet. What you see may be out of date."; }, 10000);
    const sub = (name, render) => db.collection(name).onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S[name] = m;
      if (!snap.metadata.fromCache) { clearTimeout(timer); if ($('#banner').textContent.startsWith("Can't reach")) $('#banner').hidden = true; }
      render && render();
    }, () => { clearTimeout(timer); $('#banner').hidden = false; $('#banner').textContent = "Couldn't load your shop records. Reload the page to try again."; });
    sub('customers'); sub('vehicles'); sub('bookings', renderBookings); sub('calls', renderCalls); sub('invoices', renderInvoices);
  })();
})();
</script>
