# Render Blueprint: the Blue Nile website, online booking and staff app.
# In Render: New > Blueprint > pick this repository. You'll be asked for
# STAFF_PASSWORD (the password staff use at /staff). Everything else is set here.
services:
  - type: web
    name: bluenile
    runtime: python
    plan: starter              # a paid plan is needed for the disk that keeps bookings
    region: singapore          # closest Render region to Brisbane
    branch: main
    buildCommand: pip install -r requirements.txt && python build_website.py
    startCommand: gunicorn --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT web_server:app
    healthCheckPath: /healthz
    disk:
      name: shop-data
      mountPath: /var/data     # bookings, customers, stock and invoices live here and survive deploys
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BLUENILE_DB
        value: /var/data/shop.db
      - key: SHOP_INVOICE_DIR
        value: /var/data/invoices
      - key: TRUST_PROXY
        value: "1"
      - key: STAFF_PASSWORD
        sync: false            # Render asks for this when you create the Blueprint
